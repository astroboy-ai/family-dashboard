<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FamilyOS — offline</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f3f6f3;
        color: #17241e;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #101a16; color: #eef3ef; }
      }
      .card { max-width: 380px; text-align: center; }
      .mark {
        display: inline-grid;
        place-items: center;
        width: 52px;
        height: 52px;
        margin-bottom: 18px;
        border-radius: 15px 15px 15px 5px;
        background: #17654c;
        color: #fff;
        font-size: 26px;
        font-weight: 800;
      }
      h1 { margin: 0 0 8px; font-size: 19px; }
      p { margin: 0 0 6px; font-size: 14px; line-height: 1.6; opacity: 0.75; }
      button {
        margin-top: 20px;
        padding: 10px 18px;
        border: 0;
        border-radius: 8px;
        background: #17654c;
        color: #fff;
        font-size: 14px;
        font-weight: 650;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark">F</div>
      <h1>You're offline</h1>
      <p>FamilyOS needs a connection to show your notes — it never caches them on the device.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
